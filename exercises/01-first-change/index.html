<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First change exercise</title>
    <style>
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #f3f5f7;
        color: #162431;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border: 1px solid #d4dde5;
        border-radius: 1rem;
      }
      h1 { line-height: 1.2; }
      button {
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.4rem;
        background: #125b45;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #186fbd; outline-offset: 4px; }
      output { font-size: 2.5rem; font-weight: 700; }
      .note { color: #435361; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <p>AI Build Lab / Lesson 1</p>
      <h1>My first app</h1>
      <p>Start with one small change.</p>
      <p>Wins this session: <output id="wins" aria-live="polite">0</output></p>
      <button id="add-win" type="button">Add a win</button>
      <p class="note">Refreshing this page resets the counter. This version does not save data.</p>
    </main>
    <script>
      const button = document.querySelector('#add-win');
      const counter = document.querySelector('#wins');
      let wins = 0;

      button.addEventListener('click', () => {
        wins += 1;
        counter.textContent = String(wins);
      });
    </script>
  </body>
</html>
