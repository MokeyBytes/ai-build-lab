<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Commit credit and push permission</title><desc id="desc">Changing user.email changes future commit metadata. It does not switch your login.</desc>
<rect width="1080" height="460" rx="16" fill="#f2f6fa"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172a3a}.heading{font-size:32px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:20px}.foot{font-size:18px}</style>
<text x="38" y="44" class="foot">AI BUILD LAB  /  WALKTHROUGH ILLUSTRATION  /  2026-10-18</text>
<text x="38" y="91" class="heading">Commit credit and push permission</text>
<rect x="38" y="127" width="318" height="230" rx="12" fill="#ffffff" stroke="#bccbd6"/>
<rect x="38" y="127" width="318" height="6" rx="3" fill="#087e8b"/>
<text x="57" y="174" class="label">1  Author and committer</text>
<text x="57" y="214" class="body">Stored in the commit.</text>
<text x="57" y="243" class="body">Inspect both with git log</text>
<text x="57" y="272" class="body">--format=fuller.</text>
<path d="M361 241h14m-6-6 6 6-6 6" fill="none" stroke="#087e8b" stroke-width="3"/>
<rect x="380" y="127" width="318" height="230" rx="12" fill="#ffffff" stroke="#bccbd6"/>
<rect x="380" y="127" width="318" height="6" rx="3" fill="#087e8b"/>
<text x="399" y="174" class="label">2  Push login</text>
<text x="399" y="214" class="body">The credential manager or</text>
<text x="399" y="243" class="body">SSH key authenticates a</text>
<text x="399" y="272" class="body">GitHub account.</text>
<path d="M703 241h14m-6-6 6 6-6 6" fill="none" stroke="#087e8b" stroke-width="3"/>
<rect x="722" y="127" width="318" height="230" rx="12" fill="#ffffff" stroke="#bccbd6"/>
<rect x="722" y="127" width="318" height="6" rx="3" fill="#087e8b"/>
<text x="741" y="174" class="label">3  Optional signing</text>
<text x="741" y="214" class="body">A signing key can sign a</text>
<text x="741" y="243" class="body">commit. Check its</text>
<text x="741" y="272" class="body">signature separately.</text>
<text x="38" y="398" class="foot">Changing user.email changes future commit metadata. It does not switch your login.</text>
</svg>
